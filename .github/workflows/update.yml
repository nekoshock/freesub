name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */8 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      # ★ v3.3 死节点缓存 restore — 必须在 checkout 之后、Run 之前
      #   (checkout 会清理未跟踪文件, 先 restore 会被抹掉)
      - name: Restore dead-node cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          # ★ key 含 run_id: Actions 缓存**不可覆盖**, save 时 key 已存在会报错。
          #   所以每轮存一条新的, restore 靠 restore-keys 前缀回退到最近一条。
          # ★ v1 与 main_v3.py 的 DEAD_CACHE_SCHEMA 联动: schema bump 时
          #   两处一起改, 避免旧算法的键被新代码误用。
          key: deadnodes-v1-${{ github.run_id }}
          restore-keys: |
            deadnodes-v1-

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      # ★ v3.3 死节点缓存 save — 紧跟 Run 之后, 越早存越好
      #   (Python 侧是早写 flush; 即使后面 classify/导出/提交失败, 缓存也已存住)
      - name: Save dead-node cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: deadnodes-v1-${{ github.run_id }}

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
